name: Bootstrap HBM Door Port

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part.* | base64 --decode > /tmp/hbmdoors-source.zip
          unzip -o /tmp/hbmdoors-source.zip -d .

      - name: Fetch pinned upstream HBM assets
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/mlbv/Hbm-s-Nuclear-Tech-GIT-Custom-1.12.2.git /tmp/hbm-upstream
          mapfile -t HBM_FILES < <(python tools/bootstrap_assets.py --sources)
          git -C /tmp/hbm-upstream checkout 900ca58f1b08e915903913e469e719f5fccd1134 -- "${HBM_FILES[@]}" LICENSE
          python tools/bootstrap_assets.py /tmp/hbm-upstream
          cp /tmp/hbm-upstream/LICENSE LICENSE
          python tools/verify_preserved_assets.py

      - name: Commit standalone repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import standalone HBM Nuclear door port"
          git push
