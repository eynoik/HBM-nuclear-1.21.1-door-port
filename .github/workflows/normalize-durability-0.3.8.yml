name: Normalize HBM door durability 0.3.8

on:
  push:
    branches: [ main ]
    paths: [ DURABILITY_0.3.8_TRIGGER ]

permissions:
  contents: write

jobs:
  normalize-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize all door durability and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main/java/com/hbmdoorsport/HbmDoorsPort.java')
          s = p.read_text()
          s = s.replace('"round_airlock_door", RoundAirlockDoorBlock::new, roundAirlockProperties());', '"round_airlock_door", RoundAirlockDoorBlock::new, uniformDoorProperties());')
          s = s.replace('new LegacyDoorBlock(type, p), legacyDoorProperties(type))', 'new LegacyDoorBlock(type, p), uniformDoorProperties())')
          s = s.replace('new SpecialDoorBlock(type, p), heavyDoorProperties(type))', 'new SpecialDoorBlock(type, p), uniformDoorProperties())')

          pattern = re.compile(r'\n    /\*\* Exact block hardness / blast resistance values from the pinned HBM 1\.12\.2 fork\. \*/.*?\n    private static Supplier<SoundEvent> sound', re.S)
          repl = '''
    /** Unified gameplay durability for every ported HBM door. */
    private static BlockBehaviour.Properties uniformDoorProperties() {
        return BlockBehaviour.Properties.of()
                .mapColor(MapColor.METAL)
                .strength(60F, 1_500F)
                .requiresCorrectToolForDrops()
                .noOcclusion()
                .dynamicShape();
    }

    private static Supplier<SoundEvent> sound'''
          s2, count = pattern.subn(repl, s)
          if count != 1:
              raise SystemExit(f'Expected to replace one durability section, replaced {count}')
          p.write_text(s2)

          gp = Path('gradle.properties')
          g = gp.read_text().replace('mod_version=0.3.7-alpha.1', 'mod_version=0.3.8-alpha.1')
          gp.write_text(g)

          status = Path('PORT_STATUS.md')
          old = status.read_text()
          head = '''# Port status\n\n## 0.3.8-alpha.1\n- Normalizes all 15 ported doors to the same gameplay durability: hardness 60 and explosion resistance 1500.\n- Keeps correct-tool requirement and pickaxe mining.\n- Replaces the extreme legacy spread (including near-bedrock-feeling values) with a profile only modestly tougher than obsidian.\n- No animation, sound, access-control, rendering or multiblock changes.\n\n'''
          if old.startswith('# Port status\n'):
              old = old[len('# Port status\n'):].lstrip('\n')
          status.write_text(head + old)

          Path('DURABILITY_0.3.8_TRIGGER').unlink(missing_ok=True)
          Path('.github/workflows/normalize-durability-0.3.8.yml').unlink(missing_ok=True)
          PY

      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize all HBM door durability to 60/1500"
          git push

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate resource JSON
        run: python tools/generate_resources.py

      - name: Verify assets
        run: python tools/verify_preserved_assets.py

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Publish 0.3.8 pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.3.8-alpha.1"
          TAG="v${VERSION}"
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)"
          NOTES="All 15 HBM doors now use the same durability: hardness 60, explosion resistance 1500, correct tool required, pickaxe-mineable."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --prerelease --title "HBM Nuclear Door Port ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" --prerelease --title "HBM Nuclear Door Port ${VERSION}" --notes "$NOTES"
          fi
